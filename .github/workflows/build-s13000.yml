name: Build SL3000 Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sl3000-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean system (optimize disk)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker system prune -af || true
        sudo apt-get clean

    - name: Move workspace to /mnt
      run: |
        sudo mkdir -p /mnt/openwrt /mnt/ccache
        sudo chown $USER:$USER /mnt/openwrt /mnt/ccache
        rsync -a . /mnt/openwrt/
        echo "WORKDIR=/mnt/openwrt" >> $GITHUB_ENV
        echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: /mnt/ccache
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ hashFiles('feeds.conf.default', 'feeds.conf') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}-
          ${{ runner.os }}-ccache-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
          libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
          python3 python3-pip python3-setuptools ccache perl pkg-config libelf-dev \
          libncursesw5-dev parted e2fsprogs m4 autoconf automake libgmp-dev libmpfr-dev \
          libmpc-dev gperf texinfo zstd jq

    - name: Create .config (use repo version)
      run: |
        cd "$WORKDIR"
        rm -f .config
        # 使用仓库中修复好的完整配置文件
        cp .github/configs/sl3000.config .config
        # 自动修复 default-settings
        if grep -q "^CONFIG_PACKAGE_default-settings=y" .config 2>/dev/null; then
          sed -i 's/^CONFIG_PACKAGE_default-settings=y/CONFIG_PACKAGE_default-settings=n/' .config
        fi
        make defconfig

    - name: Verify device profile (三件套检测)
      run: |
        cd "$WORKDIR"
        grep -q "sl3000-emmc" .config || { echo "Device not enabled"; exit 1; }
        DTS_612="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts"
        if [ -f "$DTS_612" ]; then
          echo "Found DTS: $DTS_612"
        else
          echo "DTS missing"
          exit 1
        fi
        grep -q "Device/sl3000-emmc" target/linux/mediatek/image/filogic.mk || { echo "filogic.mk missing"; exit 1; }

    - name: Update feeds (auto repair)
      run: |
        cd "$WORKDIR"
        rm -rf bin tmp || true
        ./scripts/feeds update -a || (sleep 3 && ./scripts/feeds update -a)
        ./scripts/feeds install -a || (sleep 3 && ./scripts/feeds install -a)

    - name: Build tools
      run: cd "$WORKDIR" && make tools/install -j1 V=s

    - name: Build toolchain
      run: cd "$WORKDIR" && make toolchain/install -j1 V=s

    - name: Build firmware
      run: cd "$WORKDIR" && make -j"$(nproc)" V=s

    - name: Check output (三件套检测)
      run: |
        TARGET_DIR="$WORKDIR/bin/targets/mediatek/filogic"
        if [ ! -d "$TARGET_DIR" ]; then
          echo "Target output dir not found"
          exit 1
        fi
        cd "$TARGET_DIR"
        ls -lh
        FW=$(ls *sl3000-emmc*sysupgrade*.bin 2>/dev/null || true)
        if [ -n "$FW" ]; then
          echo "Found firmware: $FW"
        else
          echo "No SL3000 firmware generated"
          exit 1
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-firmware
        path: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin
        retention-days: 14

    - name: Set build metadata
      run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    - name: Release firmware
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        name: SL3000 firmware release
        tag_name: sl3000-${{ env.BUILD_DATE }}
        body: |
          Auto-generated release for SL3000 (run ${{ github.run_id }})
          - Branch: ${{ github.ref }}
          - Commit: ${{ github.sha }}
        files: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin

    - name: Failure summary (log highlight)
      if: failure()
      run: |
        echo "---- Build failed. Tail of build log ----"
        find "$WORKDIR" -maxdepth 2 -name "build.log" -print -exec tail -n 200 {} \; || true
        find "$WORKDIR/dl" -maxdepth 2 -name "*.log" -print -exec tail -n 200 {} \; || true