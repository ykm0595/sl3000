name: Build SL3000-EMMC Firmware (Full Auto)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉代码（你的源分支）
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: "immortalwrt-upstream"

    # 2. 清理系统
    - name: Clean system
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker system prune -af || true
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h

    # 3. 移动到 /mnt，后续都用 $WORKDIR
    - name: Move workspace to /mnt
      run: |
        sudo mkdir -p /mnt/openwrt
        sudo chown $USER:$USER /mnt/openwrt
        rsync -a . /mnt/openwrt/
        echo "WORKDIR=/mnt/openwrt" >> $GITHUB_ENV

    # 4. 缓存 dl / ccache / toolchain
    - name: Restore DL cache
      uses: actions/cache@v3
      with:
        path: "/mnt/openwrt/dl"
        key: "dl-cache-${{ hashFiles('feeds.conf.default') }}"
        restore-keys: |
          dl-cache-

    - name: Restore ccache
      uses: actions/cache@v3
      with:
        path: "/home/runner/.ccache"
        key: "ccache-${{ github.ref }}"
        restore-keys: |
          ccache-

    - name: Limit ccache size
      run: ccache -M 2G || true

    - name: Restore toolchain cache
      uses: actions/cache@v3
      with:
        path: |
          /mnt/openwrt/staging_dir
          /mnt/openwrt/build_dir/toolchain-*
        key: toolchain-${{ hashFiles('toolchain/**', 'target/linux/**') }}
        restore-keys: |
          toolchain-

    # 5. 安装依赖
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib gettext git \
          libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
          python3 python3-pip python3-setuptools ccache perl pkg-config libelf-dev \
          libncursesw5-dev parted e2fsprogs m4 autoconf automake \
          libgmp-dev libmpfr-dev libmpc-dev gperf texinfo zstd jq
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Allow root configure
      run: echo "FORCE_UNSAFE_CONFIGURE=1" >> $GITHUB_ENV

    # 6. 清理构建目录
    - name: Aggressive clean
      run: |
        cd $WORKDIR
        rm -rf bin tmp build_dir/stamp .config .config.old || true
        df -h

    # 7. 写入 SL3000-EMMC 的 .config（核心三件套之一）
    - name: Create .config for SL3000-EMMC
      run: |
        cd $WORKDIR
        cat > .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
EOF
        make defconfig

    # 8. 检查三件套：.config + DTS + mk
    - name: Verify aligned three-piece
      run: |
        cd $WORKDIR

        echo "Checking .config target..."
        grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y" .config \
          && echo ".config OK" || { echo "Device not enabled in .config"; exit 1; }

        echo "Checking DTS..."
        DTS="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts"
        test -f "$DTS" && echo "DTS OK: $DTS" || { echo "DTS missing: $DTS"; exit 1; }

        echo "Checking filogic.mk..."
        grep -q "Device/sl3000-emmc" target/linux/mediatek/image/filogic.mk \
          && grep -q "TARGET_DEVICES \+= sl3000-emmc" target/linux/mediatek/image/filogic.mk \
          && echo "filogic.mk OK" || { echo "filogic.mk missing sl3000-emmc"; exit 1; }

    # 9. feeds
    - name: Update and install feeds
      run: |
        cd $WORKDIR
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 10. 构建 tools
    - name: Build tools
      run: |
        cd $WORKDIR
        make tools/install -j1 V=s

    # 11. 构建 toolchain
    - name: Build toolchain
      run: |
        cd $WORKDIR
        make toolchain/install -j1 V=s

    # 12. 构建固件（包含 sysupgrade/initramfs/factory 等）
    - name: Build firmware
      run: |
        cd $WORKDIR
        make -j$(nproc) V=s

    # 13. 检查输出里是否有 sl3000-emmc 的固件
    - name: Check output images
      run: |
        cd $WORKDIR/bin/targets/mediatek/filogic/
        ls -lh

        # sysupgrade
        SYSUP=$(ls *sl3000-emmc*sysupgrade*.bin 2>/dev/null || true)
        # factory / recovery / initramfs（视你的 image 定义而定，尽可能多匹配）
        FACT=$(ls *sl3000-emmc*factory* 2>/dev/null || true)
        INITR=$(ls *sl3000-emmc*initramfs* 2>/dev/null || true)
        RECV=$(ls *sl3000-emmc*recovery* 2>/dev/null || true)

        echo "SYSUP: $SYSUP"
        echo "FACT:  $FACT"
        echo "INITR: $INITR"
        echo "RECV:  $RECV"

        if [ -z "$SYSUP" ] && [ -z "$FACT" ] && [ -z "$INITR" ] && [ -z "$RECV" ]; then
          echo "No SL3000-EMMC images generated"
          exit 1
        fi

    # 14. 上传所有 sl3000-emmc 相关固件
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-EMMC-images
        path: |
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*factory*
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*initramfs*
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*recovery*

    # 15. 自动发布 Release（tag + 所有固件文件）
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: sl3000-emmc-$(date +'%Y%m%d-%H%M')
        name: SL3000-EMMC Firmware $(date +'%Y-%m-%d %H:%M')
        body: |
          自动构建 SL3000-EMMC 固件：
          - 三件套对齐：.config + DTS + filogic.mk
          - 自动构建 tools / toolchain / firmware
          - 自动检查输出 image（sysupgrade/factory/initramfs/recovery）
          - 自动上传 artifacts + 发布 Release
        files: |
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*factory*
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*initramfs*
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*recovery*