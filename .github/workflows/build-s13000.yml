name: Build SL3000-EMMC Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: immortalwrt-upstream

    - name: Clean system
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker system prune -af || true

    - name: Move workspace to /mnt
      run: |
        sudo mkdir -p /mnt/openwrt
        sudo chown $USER:$USER /mnt/openwrt
        rsync -a . /mnt/openwrt/
        echo "WORKDIR=/mnt/openwrt" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib gettext git \
          libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
          python3 python3-pip python3-setuptools ccache perl pkg-config libelf-dev \
          libncursesw5-dev parted e2fsprogs m4 autoconf automake \
          libgmp-dev libmpfr-dev libmpc-dev gperf texinfo zstd jq

    - name: Create .config
      run: |
        cd $WORKDIR
        rm -f .config
        echo CONFIG_TARGET_mediatek=y >> .config
        echo CONFIG_TARGET_mediatek_filogic=y >> .config
        echo CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y >> .config
        echo CONFIG_TARGET_ROOTFS_SQUASHFS=y >> .config
        make defconfig

    - name: Verify three-piece
      run: |
        cd $WORKDIR

        echo Checking .config
        grep -q CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y .config || exit 1

        echo Checking DTS
        test -f target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts || exit 1

        echo Checking filogic.mk
        grep -q "Device/sl3000-emmc" target/linux/mediatek/image/filogic.mk || exit 1
        grep -q "TARGET_DEVICES += sl3000-emmc" target/linux/mediatek/image/filogic.mk || exit 1

    - name: Update feeds
      run: |
        cd $WORKDIR
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build tools
      run: |
        cd $WORKDIR
        make tools/install -j1 V=s

    - name: Build toolchain
      run: |
        cd $WORKDIR
        make toolchain/install -j1 V=s

    - name: Build firmware
      run: |
        cd $WORKDIR
        make -j$(nproc) V=s

    - name: Check output
      run: |
        cd $WORKDIR/bin/targets/mediatek/filogic/
        ls -lh
        FW=$(ls *sl3000-emmc*sysupgrade*.bin 2>/dev/null || true)
        if [ -z "$FW" ]; then
          echo No firmware found
          exit 1
        fi
        echo Found firmware: $FW

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-EMMC-firmware
        path: ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin

    - name: Set build metadata
      run: |
        echo BUILD_DATE=$(date +%Y%m%d-%H%M) >> $GITHUB_ENV
        echo BUILD_DATETIME=$(date +%Y-%m-%d_%H:%M) >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: sl3000-emmc-${{ env.BUILD_DATE }}
        name: SL3000-EMMC Firmware ${{ env.BUILD_DATETIME }}
        body: |
          自动构建 SL3000-EMMC 固件
          - 三件套对齐
          - 自动构建工具链
          - 自动构建固件
        files: |
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin
