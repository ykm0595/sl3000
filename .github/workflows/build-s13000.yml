name: Build SL3000 Firmware

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  full-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare workspace
      run: |
        sudo mkdir -p /mnt/openwrt /mnt/ccache /mnt/dl
        sudo chown $USER:$USER /mnt/openwrt /mnt/ccache /mnt/dl
        rsync -a . /mnt/openwrt/
        echo "WORKDIR=/mnt/openwrt" >> $GITHUB_ENV
        echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
        echo "DL_DIR=/mnt/dl" >> $GITHUB_ENV
        echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV
        df -h / /mnt || true

    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: /mnt/ccache
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache

    - name: Cache dl sources
      uses: actions/cache@v3
      with:
        path: /mnt/dl
        key: ${{ runner.os }}-dl-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-dl-${{ github.ref }}
          ${{ runner.os }}-dl

    - name: Cache toolchain
      uses: actions/cache@v3
      with:
        path: /mnt/openwrt/staging_dir/toolchain-*
        key: ${{ runner.os }}-toolchain-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-toolchain-${{ github.ref }}
          ${{ runner.os }}-toolchain

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
          libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
          python3 python3-pip python3-setuptools ccache perl pkg-config libelf-dev \
          libncursesw5-dev parted e2fsprogs m4 autoconf automake libgmp-dev libmpfr-dev \
          libmpc-dev gperf texinfo zstd jq

    - name: Update feeds
      run: |
        cd "$WORKDIR"
        ./scripts/feeds update -a || (sleep 3 && ./scripts/feeds update -a)
        ./scripts/feeds install -a || (sleep 3 && ./scripts/feeds install -a)

    - name: Auto-fix 三件套
      run: |
        cd "$WORKDIR"
        rm -f .config
        cat >> .config <<'EOF'
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_sl3000-emmc=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        EOF
        make defconfig
        yes "" | make oldconfig

        PATCHVER=$(grep -E '^KERNEL_PATCHVER' target/linux/mediatek/Makefile | cut -d= -f2 | tr -d ' ')
        [ -n "$PATCHVER" ] || PATCHVER="6.6"
        DTS="target/linux/mediatek/files-$PATCHVER/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts"
        [ -f "$DTS" ] || { echo "错误: DTS 文件不存在 $DTS"; exit 1; }

        MK=target/linux/mediatek/image/filogic.mk
        cat > $MK <<'EOF'
        include $(TOPDIR)/rules.mk
        include $(INCLUDE_DIR)/image.mk
        DEFAULT_PACKAGES += uboot-envtools
        define Device/sl3000-emmc
          DEVICE_VENDOR := SL
          DEVICE_MODEL := SL3000
          DEVICE_VARIANT := EMMC
          DEVICE_DTS := mt7981b-sl3000-emmc
          DEVICE_DTS_DIR := $(DTS_DIR)/mediatek
          DEVICE_PACKAGES := kmod-usb3 kmod-usb2 kmod-usb-ohci kmod-usb-uhci \
            kmod-mt7981-firmware kmod-mt76-core kmod-mt76-connac \
            kmod-mediatek_eth kmod-mediatek_hnat kmod-mt7531 \
            kmod-mmc kmod-mmc-mtk \
            block-mount e2fsprogs mkf2fs f2fsck \
            wireless-regdb wpad-basic-mbedtls
          SUPPORTED_DEVICES := sl3000 sl3000-emmc
          IMAGE_SIZE := 256m
          IMAGES += sysupgrade.bin
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata | check-size
          $(call Device/FitImage)
        endef
        TARGET_DEVICES += sl3000-emmc
        EOF

    - name: Verify 三件套 before build
      run: |
        cd "$WORKDIR"
        grep "sl3000-emmc" .config || { echo ".config 缺少 sl3000-emmc"; exit 1; }
        grep "sl3000-emmc" target/linux/mediatek/image/filogic.mk || { echo "filogic.mk 缺少 sl3000-emmc"; exit 1; }
        ls target/linux/mediatek/files-*/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts || { echo "DTS 缺失"; exit 1; }

    - name: Build firmware
      run: |
        cd "$WORKDIR"
        make download -j2 || make download -j1
        make tools/install -j1 V=s | tee build_tools.log
        make toolchain/install -j1 V=s | tee build_toolchain.log
        rm -rf bin tmp build_dir/target-*/root-*/.*tmp || true
        make -j$(nproc) V=s | tee build_world.log || make -j1 V=s | tee build_world.log

    - name: Dump diffconfig
      run: |
        cd "$WORKDIR"
        ./scripts/diffconfig.sh | tee diffconfig.log
        grep "sl3000-emmc" diffconfig.log || { echo "最终配置未启用 sl3000-emmc"; exit 1; }

    - name: Check output
      run: |
        TARGET_DIR="$WORKDIR/bin/targets/mediatek/filogic"
        cd "$TARGET_DIR"
        ls -lh
        FW=$(ls *sl3000-emmc*sysupgrade*.bin 2>/dev/null || true)
        if [ -n "$FW" ]; then
          SIZE=$(stat -c%s "$FW")
          [ "$SIZE" -gt 4000000 ] || { echo "固件过小 ($SIZE bytes)"; exit 1; }
          echo "找到固件: $FW ($SIZE bytes)"
          sha256sum $FW | tee "$WORKDIR/bin/targets/mediatek/filogic/sha256sums.txt"
        else
          echo "未生成 SL3000 固件"
          exit 1
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-firmware
        path: |
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/*sl3000-emmc*sysupgrade*.bin
          ${{ env.WORKDIR }}/bin/targets/mediatek/filogic/sha256sums.txt
        retention-days: 30

    - name: Upload diffconfig
      uses: actions/upload-artifact@v4
      with:
        name: diffconfig-log
        path: ${{ env.WORKDIR }}/diffconfig.log
        retention-days: 14

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ${{ env.WORKDIR }}/build_tools.log
          ${{ env.WORKDIR }}/build_toolchain.log
          ${{ env.WORKDIR }}/build_world.log
        retention-days: 30