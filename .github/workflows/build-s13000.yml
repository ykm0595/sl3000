name: ImmortalWrt Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  packages: read
  pull-requests: read

env:
  PROFILE: sl3000-emmc
  DTS_NAME: mt7981b-sl3000-emmc
  DTS_FILE: target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-sl3000-emmc.dts
  DTS_MK: target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/Makefile
  MK_FILE: target/linux/mediatek/image/filogic.mk
  TARGET_DIR: bin/targets/mediatek/filogic
  CCACHE_DIR: ~/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker system prune -af || true

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison gawk gettext libncurses5-dev libssl-dev \
            python3 unzip zlib1g-dev file wget curl git coreutils ccache time \
            pkg-config libelf-dev rsync tar jq ca-certificates

      - name: 缓存构建目录
        uses: actions/cache@v4
        with:
          path: |
            dl
            build_dir
            staging_dir
            tmp
          key: ${{ runner.os }}-immortalwrt-${{ env.PROFILE }}-${{ hashFiles('feeds.conf.default','package/**','tools/**','toolchain/**','target/**') }}

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ env.PROFILE }}-${{ github.ref }}

      - name: 配置 ccache
        run: |
          ccache -M 2G
          ccache -s

      - name: 强制重建工具链
        run: rm -rf staging_dir/toolchain-* staging_dir/host pkginfo/toolchain || true

      - name: feeds 自动修复
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译 tools/toolchain
        run: |
          if timeout 20m make tools/install -j$(nproc); then echo "tools ok"; else make tools/install -j1 V=s; fi
          if timeout 20m make toolchain/install -j$(nproc); then echo "toolchain ok"; else make toolchain/install -j1 V=s; fi

      - name: 自动添加 DTS Makefile 条目
        run: grep -q "${DTS_NAME}.dtb" "${DTS_MK}" || echo "dtb-y += ${DTS_NAME}.dtb" >> "${DTS_MK}"

      - name: 检查 DTS/mk/profile 对齐
        run: |
          test -f "${DTS_FILE}" || { echo "❌ DTS 缺失"; exit 1; }
          grep -q "${DTS_NAME}.dtb" "${DTS_MK}" || { echo "❌ DTS_MK 缺少条目"; exit 1; }
          grep -q "${PROFILE}" "${MK_FILE}" || { echo "❌ MK_FILE 缺少 profile"; exit 1; }

      - name: DTS 编译检查
        run: |
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
          find build_dir/target-*/linux-*/image -name "*.dtb" -exec ls -lh {} \;

      - name: 生成 .config
        run: |
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${PROFILE}=y"
            echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
            echo "CONFIG_CCACHE=y"
          } > .config
          make defconfig
          make olddefconfig
          yes "" | make oldconfig

      - name: 编译固件
        run: |
          if timeout 40m make -j$(nproc); then echo "并行编译成功"; else make -j1 V=s; fi

      - name: 验证固件输出
        run: |
          ls -lh "${TARGET_DIR}"
          compgen -G "${TARGET_DIR}/*sysupgrade.bin" > /dev/null || { echo "❌ 缺少 sysupgrade.bin"; exit 1; }
          compgen -G "${TARGET_DIR}/*initramfs*.bin" > /dev/null || { echo "❌ 缺少 initramfs 镜像"; exit 1; }
          (cd "${TARGET_DIR}" && sha256sum * > sha256sums.txt)
          (cd "${TARGET_DIR}" && ls -1 > profiles.txt)

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.PROFILE }}-firmware
          path: |
            ${{ env.TARGET_DIR }}/*sysupgrade.bin
            ${{ env.TARGET_DIR }}/*initramfs*.bin
            ${{ env.TARGET_DIR }}/sha256sums.txt
            ${{ env.TARGET_DIR }}/profiles.txt
            ${{ env.TARGET_DIR }}/*.manifest
            ${{ env.TARGET_DIR }}/*.buildinfo
            ${{ env.TARGET_DIR }}/profiles.json